[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sglm"
version = "0.1.0"
description = "Semantically Guided Lightweight Optical-SAR Matching"
requires-python = ">=3.10"
dependencies = ["torch>=2.7", "numpy>=1.24", "opencv-python-headless>=4.8", "Pillow>=10"]

[tool.setuptools.packages.find]
include = ["sglm*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
